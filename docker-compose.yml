name: emergi-access

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emergi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emergi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-emergi_access}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emergi} -d ${POSTGRES_DB:-emergi_access}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-emergi}:${POSTGRES_PASSWORD:-emergi_dev_password}@db:5432/${POSTGRES_DB:-emergi_access}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-file-please-0123456789abcdef}
      OTP_SECRET: ${OTP_SECRET:-change-me-otp-secret-0123456789abcdef}
      CORS_ORIGINS: http://localhost:8088
      # Cookies are served over plain HTTP in the local compose stack. Set to true behind HTTPS.
      COOKIE_SECURE: "false"
      DEMO_MODE: "true"
      SEED_ON_START: ${SEED_ON_START:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"

volumes:
  pgdata:
